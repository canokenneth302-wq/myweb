<!DOCTYPE html>
<html lang="fil">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Online Enrollment</title>
<style>
  :root { --blue:#1d4ed8; --bg:#f3f4f6; --ok:#15803d; --bad:#b91c1c; }
  * { box-sizing:border-box; }
  body { font-family:system-ui,Arial,sans-serif; background:var(--bg); margin:0; color:#111827; }
  header { background:var(--blue); color:#fff; padding:16px 20px; }
  header h1 { margin:0; font-size:20px; }
  main { max-width:820px; margin:20px auto; padding:0 16px; }
  .steps { display:flex; gap:6px; margin-bottom:16px; }
  .steps div { flex:1; text-align:center; padding:8px 4px; font-size:13px; background:#e5e7eb; border-radius:6px; }
  .steps div.active { background:var(--blue); color:#fff; font-weight:600; }
  .steps div.done { background:#bfdbfe; }
  .card { background:#fff; border-radius:10px; padding:20px; box-shadow:0 1px 3px rgba(0,0,0,.1); }
  h2 { margin-top:0; font-size:18px; }
  label { display:block; font-size:14px; margin:12px 0 4px; font-weight:600; }
  input, select { width:100%; padding:10px; border:1px solid #d1d5db; border-radius:6px; font-size:15px; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  @media (max-width:560px){ .row{grid-template-columns:1fr;} .steps{font-size:11px;} }
  .btns { display:flex; justify-content:space-between; margin-top:20px; gap:10px; }
  button { padding:10px 20px; border:0; border-radius:6px; font-size:15px; cursor:pointer; }
  .primary { background:var(--blue); color:#fff; }
  .secondary { background:#e5e7eb; }
  .hidden { display:none; }
  table { width:100%; border-collapse:collapse; font-size:14px; }
  th, td { padding:8px; border-bottom:1px solid #e5e7eb; text-align:left; }
  tr.sel { background:#dbeafe; }
  tr.full { opacity:.5; }
  .msg { padding:10px; border-radius:6px; margin-top:12px; font-size:14px; }
  .msg.err { background:#fee2e2; color:var(--bad); }
  .msg.ok { background:#dcfce7; color:var(--ok); }
  .total { font-size:18px; font-weight:700; text-align:right; margin-top:12px; }
  .slot-low { color:var(--bad); font-weight:600; }
</style>
</head>
<body>
<header><h1>🎓 Online Enrollment — SY 2026-2027, 1st Sem</h1></header>
<main>
  <div class="steps" id="steps">
    <div>1. Personal Info</div><div>2. Subjects</div><div>3. Requirements</div><div>4. Payment</div><div>5. Confirm</div>
  </div>

  <!-- STEP 1 -->
  <section class="card step" id="step1">
    <h2>Personal Information</h2>
    <div class="row">
      <div><label>First Name *</label><input id="fname"></div>
      <div><label>Last Name *</label><input id="lname"></div>
    </div>
    <div class="row">
      <div><label>Birthdate *</label><input type="date" id="bdate"></div>
      <div><label>Sex *</label>
        <select id="sex"><option value="">Pumili</option><option>Male</option><option>Female</option></select></div>
    </div>
    <div class="row">
      <div><label>Email *</label><input type="email" id="email"></div>
      <div><label>Contact No. *</label><input id="contact" placeholder="09XXXXXXXXX"></div>
    </div>
    <label>Address</label><input id="address">
    <div class="row">
      <div><label>Program *</label>
        <select id="program"><option value="">Pumili</option><option>BSIT</option><option>BSED</option></select></div>
      <div><label>Year Level *</label>
        <select id="year"><option value="">Pumili</option><option>1</option><option>2</option><option>3</option><option>4</option></select></div>
    </div>
    <div class="msg err hidden" id="err1"></div>
    <div class="btns"><span></span><button class="primary" onclick="next(1)">Susunod →</button></div>
  </section>

  <!-- STEP 2 -->
  <section class="card step hidden" id="step2">
    <h2>Piliin ang Subjects</h2>
    <table>
      <thead><tr><th></th><th>Code</th><th>Subject</th><th>Units</th><th>Schedule</th><th>Slots</th></tr></thead>
      <tbody id="subjectBody"></tbody>
    </table>
    <div class="total" id="totalUnits">Total: 0 units</div>
    <div class="msg err hidden" id="err2"></div>
    <div class="btns"><button class="secondary" onclick="back(2)">← Bumalik</button><button class="primary" onclick="next(2)">Susunod →</button></div>
  </section>

  <!-- STEP 3 -->
  <section class="card step hidden" id="step3">
    <h2>I-upload ang Requirements</h2>
    <label>Valid ID </label><input type="file" id="doc1" accept="image/,.pdf">
    <label>Report Card / Grades </label><input type="file" id="doc2" accept="image/,.pdf">
    <label>PSA Birth Certificate </label><input type="file" id="doc3" accept="image/,.pdf">
    <div class="msg err hidden" id="err3"></div>
    <div class="btns"><button class="secondary" onclick="back(3)">← Bumalik</button><button class="primary" onclick="next(3)">Susunod →</button></div>
  </section>

  <!-- STEP 4 -->
  <section class="card step hidden" id="step4">
    <h2>Payment</h2>
    <div class="total" id="amountDue" style="text-align:left">Amount Due: ₱0.00</div>
    <label>Paraan ng Bayad *</label>
    <select id="method"><option value="">Pumili</option><option>GCash</option><option>Maya</option><option>Bank Transfer</option><option>Cash (sa Cashier)</option></select>
    <label>Reference No.</label><input id="refno">
    <label>Proof of Payment</label><input type="file" id="proof" accept="image/*,.pdf">
    <div class="msg err hidden" id="err4"></div>
    <div class="btns"><button class="secondary" onclick="back(4)">← Bumalik</button><button class="primary" onclick="next(4)">Susunod →</button></div>
  </section>

  <!-- STEP 5 -->
  <section class="card step hidden" id="step5">
    <h2>Review at Confirm</h2>
    <div id="summary"></div>
    <div class="btns"><button class="secondary" onclick="back(5)">← Bumalik</button><button class="primary" onclick="submitEnroll()">I-submit ang Enrollment</button></div>
    <div class="msg ok hidden" id="done"></div>
  </section>
</main>

<script>
// ---- SAMPLE DATA (palitan ng galing sa database/API) ----
const RATE_PER_UNIT = 800;   // halimbawa lang
const sections = [
  {id:1, code:'IT101', name:'Intro to Computing',          units:3, days:'MWF', start:'08:00', end:'09:00', slots:5},
  {id:2, code:'IT102', name:'Programming 1',               units:3, days:'MWF', start:'08:30', end:'09:30', slots:12}, // conflict sa IT101
  {id:3, code:'IT103', name:'Web Systems & Technologies',  units:3, days:'TTh', start:'10:00', end:'11:30', slots:20},
  {id:4, code:'GE101', name:'Understanding the Self',      units:3, days:'TTh', start:'13:00', end:'14:30', slots:0},  // puno na
  {id:5, code:'GE102', name:'Mathematics in the Modern World', units:3, days:'MWF', start:'10:00', end:'11:00', slots:30},
];
let current = 1;
const selected = new Set();

// ---- helpers ----
const $ = id => document.getElementById(id);
const toMin = t => { const [h,m] = t.split(':').map(Number); return h*60+m; };
const dayList = d => d.replace('Th','R').split('');
function conflicts(a,b){
  const shareDay = dayList(a.days).some(x => dayList(b.days).includes(x));
  return shareDay && toMin(a.start) < toMin(b.end) && toMin(b.start) < toMin(a.end);
}
function showErr(n, msg){ const e=$('err'+n); e.textContent=msg; e.classList.remove('hidden'); }
function clearErr(n){ $('err'+n).classList.add('hidden'); }

// ---- steps UI ----
function render(){
  document.querySelectorAll('.step').forEach((s,i)=>s.classList.toggle('hidden', i+1!==current));
  [...$('steps').children].forEach((d,i)=>{
    d.className = i+1===current ? 'active' : (i+1<current ? 'done' : '');
  });
  window.scrollTo(0,0);
}
function back(n){ current=n-1; render(); }

function next(n){
  clearErr(n);
  if(n===1){
    const req = ['fname','lname','bdate','sex','email','contact','program','year'];
    if(req.some(id=>!$(id).value.trim())) return showErr(1,'Pakikumpleto ang lahat ng may * na field.');
    if(!/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test($('email').value)) return showErr(1,'Mali ang email format.');
    if(!/^09\d{9}$/.test($('contact').value.trim())) return showErr(1,'Contact no. dapat 11 digits at nagsisimula sa 09.');
    buildSubjects();
  }
  if(n===2){
    if(selected.size===0) return showErr(2,'Pumili ng kahit isang subject.');
    $('amountDue').textContent = 'Amount Due: ₱' + (totalUnits()*RATE_PER_UNIT).toLocaleString(undefined,{minimumFractionDigits:2});
  }
  if(n===3){
    if(!$('doc1').files.length || !$('doc2').files.length || !$('doc3').files.length)
      return showErr(3,'I-upload ang lahat ng requirements.');
  }
  if(n===4){
    if(!$('method').value) return showErr(4,'Pumili ng paraan ng bayad.');
    if($('method').value!=='Cash (sa Cashier)' && (!$('refno').value.trim() || !$('proof').files.length))
      return showErr(4,'Ilagay ang reference no. at i-upload ang proof of payment.');
    buildSummary();
  }
  current=n+1; render();
}

// ---- subjects ----
function totalUnits(){ return sections.filter(s=>selected.has(s.id)).reduce((a,s)=>a+s.units,0); }
function buildSubjects(){
  const body = $('subjectBody'); body.innerHTML='';
  sections.forEach(s=>{
    const tr = document.createElement('tr');
    if(s.slots===0) tr.className='full';
    tr.innerHTML = `<td><input type="checkbox" ${s.slots===0?'disabled':''} ${selected.has(s.id)?'checked':''}></td>
      <td>${s.code}</td><td>${s.name}</td><td>${s.units}</td>
      <td>${s.days} ${s.start}-${s.end}</td>
      <td class="${s.slots<=5?'slot-low':''}">${s.slots===0?'FULL':s.slots}</td>`;
    tr.querySelector('input').addEventListener('change', e=>toggle(s, e.target, tr));
    if(selected.has(s.id)) tr.classList.add('sel');
    body.appendChild(tr);
  });
  $('totalUnits').textContent = 'Total: ' + totalUnits() + ' units';
}
function toggle(s, box, tr){
  clearErr(2);
  if(box.checked){
    const clash = sections.find(o=>selected.has(o.id) && conflicts(o,s));
    if(clash){ box.checked=false; return showErr(2,`Conflict ang ${s.code} sa ${clash.code} (parehong oras).`); }
    selected.add(s.id); tr.classList.add('sel');
  } else { selected.delete(s.id); tr.classList.remove('sel'); }
  $('totalUnits').textContent = 'Total: ' + totalUnits() + ' units';
}

// ---- summary & submit ----
function buildSummary(){
  const subs = sections.filter(s=>selected.has(s.id));
  $('summary').innerHTML = `
    <p><b>${$('fname').value} ${$('lname').value}</b> — ${$('program').value}, Year ${$('year').value}<br>
    ${$('email').value} | ${$('contact').value}</p>
    <table><thead><tr><th>Code</th><th>Subject</th><th>Units</th><th>Schedule</th></tr></thead><tbody>
    ${subs.map(s=>`<tr><td>${s.code}</td><td>${s.name}</td><td>${s.units}</td><td>${s.days} ${s.start}-${s.end}</td></tr>`).join('')}
    </tbody></table>
    <div class="total">Total: ${totalUnits()} units — ₱${(totalUnits()*RATE_PER_UNIT).toLocaleString(undefined,{minimumFractionDigits:2})}</div>
    <p>Paraan ng bayad: <b>${$('method').value}</b></p>`;
}
function submitEnroll(){
  // DITO: i-send sa backend gamit fetch('/api/enroll', {method:'POST', body: formData})
  const ref = 'ENR-' + Date.now().toString().slice(-8);
  const d = $('done');
  d.innerHTML = `✅ Naisumite na! Reference No: <b>${ref}</b><br>Hintayin ang email/SMS kapag na-approve na ng Registrar.`;
  d.classList.remove('hidden');
}
render();
</script>
</body>
</html>
